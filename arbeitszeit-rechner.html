<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Worth my time</title>
<style>
:root{--ink:#1c1c1e;--mute:#5c5c63;--acc:#0a84ff;--acc2:#5e5ce6;--glass:rgba(255,255,255,.38);--gb:rgba(255,255,255,.65);--field:rgba(255,255,255,.5);--line:rgba(60,60,67,.18);--warn:#ff3b30;--sh:0 10px 40px rgba(40,50,110,.18);
--b1:#d6e6f7;--b2:#e3e0f3;--b3:#f0e4ec;--b4:#dcecea;--base:#eef0f3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f5f5f7;--mute:#a1a1aa;--acc:#64d2ff;--acc2:#bf5af2;--glass:rgba(40,42,54,.42);--gb:rgba(255,255,255,.16);--field:rgba(255,255,255,.09);--line:rgba(255,255,255,.14);--warn:#ff6961;--sh:0 10px 40px rgba(0,0,0,.45);--b1:#1d4ed8;--b2:#7c3aed;--b3:#be185d;--b4:#0f766e;--base:#0b0d14}}
:root[data-theme="dark"]{--ink:#f5f5f7;--mute:#a1a1aa;--acc:#64d2ff;--acc2:#bf5af2;--glass:rgba(40,42,54,.42);--gb:rgba(255,255,255,.16);--field:rgba(255,255,255,.09);--line:rgba(255,255,255,.14);--warn:#ff6961;--sh:0 10px 40px rgba(0,0,0,.45);--b1:#1d4ed8;--b2:#7c3aed;--b3:#be185d;--b4:#0f766e;--base:#0b0d14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);background:var(--base);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Inter,'Segoe UI',sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
radial-gradient(45% 35% at 15% 10%,var(--b1),transparent 70%),
radial-gradient(40% 35% at 90% 20%,var(--b2),transparent 70%),
radial-gradient(45% 40% at 80% 90%,var(--b3),transparent 70%),
radial-gradient(40% 35% at 10% 85%,var(--b4),transparent 70%)}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:2rem;font-weight:700;margin:10px 4px 20px;letter-spacing:-.03em;line-height:1.1}
section{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--gb);border-radius:28px;padding:18px;margin-bottom:16px;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.08)}
h2{font-size:1.05rem;font-weight:600;margin:0 0 14px;letter-spacing:-.01em}
label{display:block;font-size:.8rem;color:var(--mute);margin-bottom:10px;font-weight:500}
input{width:100%;margin-top:5px;padding:12px 14px;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
input::placeholder{color:var(--mute);opacity:.7}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{position:relative;display:flex;gap:4px;padding:4px;margin-bottom:14px;background:var(--field);border:1px solid var(--line);border-radius:999px}
.seg button{position:relative;z-index:1;flex:1;padding:9px;font:inherit;font-weight:500;border:0;background:none;color:var(--ink);border-radius:999px;cursor:pointer;transition:background .25s,box-shadow .25s}
.seg button[aria-pressed="true"]{font-weight:600}

.thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.6));box-shadow:0 2px 10px rgba(0,0,0,.18),inset 0 1px 0 #fff;transition:transform .4s cubic-bezier(.34,1.4,.5,1)}
.thumb.r{transform:translateX(100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .thumb{background:rgba(255,255,255,.22);box-shadow:0 2px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.3)}}
:root[data-theme="dark"] .thumb{background:rgba(255,255,255,.22)}
.item{display:grid;grid-template-columns:1fr 110px 42px;gap:8px;align-items:end;margin-bottom:6px}
.item.fx{grid-template-columns:1fr 90px 84px 42px}
.item label{margin:0}
select{width:100%;margin-top:5px;padding:12px 8px;font:inherit;font-size:.95rem;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@media (max-width:380px){.item.fx{grid-template-columns:1fr 80px 74px 38px;font-size:.9rem}}
.del{height:47px;border:1px solid var(--line);background:var(--field);color:var(--warn);border-radius:14px;font-size:1.3rem;cursor:pointer}
.add{width:100%;margin-top:6px;padding:13px;font:inherit;font-weight:600;border:0;color:#fff;border-radius:999px;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 6px 18px rgba(10,132,255,.35),inset 0 1px 0 rgba(255,255,255,.45)}
.add:active{transform:scale(.98)}
.res{padding:14px 0;border-top:1px solid var(--line)}
.res:first-of-type{border-top:0;padding-top:0}
.res .n{font-weight:600}
.res .big{font-size:2rem;font-weight:700;letter-spacing:-.03em;color:var(--acc)}
.res .sub{color:var(--mute);font-size:.9rem}
.total{background:linear-gradient(135deg,rgba(10,132,255,.22),rgba(94,92,230,.22));border:1px solid var(--gb);border-radius:20px;padding:16px;margin-top:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.total .big{font-size:2.4rem}
.note{color:var(--mute);font-size:.82rem;margin:4px 2px}
.err{color:var(--warn);font-size:.95rem}
@media (max-width:380px){.item{grid-template-columns:1fr 90px 40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<h1>Worth my time</h1>

<section>
<h2>Dein Einkommen</h2>
<div class="seg" role="group" aria-label="Eingabeart">
<span class="thumb" id="thumb"></span>
<button id="m-hour" aria-pressed="true">Stundenlohn</button>
<button id="m-month" aria-pressed="false">Monatsgehalt</button>
</div>
<div class="row">
<label><span id="wl">Stundenlohn (CHF)</span><input id="wage" type="number" inputmode="decimal" min="0" step="0.01"></label>
<label>Stunden pro Woche<input id="hw" type="number" inputmode="decimal" min="1" step="0.5"></label>
</div>
<div class="row">
<label>Abzüge (%)<input id="ded" type="number" inputmode="decimal" min="0" max="99" step="0.5"></label>
<label>Schon gespart (CHF)<input id="saved" type="number" inputmode="decimal" min="0" step="1"></label>
</div>
<p class="note" id="netinfo"></p>
</section>

<section>
<h2>Fixkosten</h2>
<div id="fixed"></div>
<button class="add" id="addFixed">+ Fixkosten hinzufügen</button>

</section>

<section>
<h2>Gegenstände</h2>
<div id="items"></div>
<button class="add" id="add">+ Gegenstand hinzufügen</button>
</section>

<section>
<h2>Ergebnis</h2>
<div id="out"></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const KEY='arbeitszeit-rechner-v1';
let S={mode:'hour',wage:'',hw:40,ded:0,saved:0,items:[{name:'',price:''}],fixed:[{name:'',price:'',period:'month'}]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(!Array.isArray(S.items)||!S.items.length)S.items=[{name:'',price:''}];
if(!Array.isArray(S.fixed)||!S.fixed.length)S.fixed=[{name:'',price:'',period:'month'}];
S.fixed.forEach(f=>{if(!f.period)f.period='month'});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)&&n>0?n:0};
const eur=n=>n.toLocaleString('de-DE',{style:'currency',currency:'CHF'});
const dec=n=>n.toLocaleString('de-DE',{maximumFractionDigits:1});
function dur(h){
  if(h<=0)return '0 Std';
  const t=Math.round(h*60),H=Math.floor(t/60),M=t%60;
  return H+' Std'+(M?' '+M+' Min':'');
}
function netHourly(){
  const w=num(S.wage),hw=num(S.hw),f=1-Math.min(num(S.ded),99)/100;
  if(!w||!hw)return 0;
  return S.mode==='hour'?w*f:w*f/(hw*52/12);
}
function fixedMonthly(){
  return S.fixed.reduce((sum,i)=>{
    const p=num(i.price);if(!p)return sum;
    return sum+(i.period==='year'?p/12:p);
  },0);
}
function effectiveHourly(nh){
  const hw=num(S.hw);
  if(!nh||!hw)return 0;
  const monthlyHours=hw*52/12,fm=fixedMonthly();
  if(!fm)return nh;
  const perHour=fm/monthlyHours;
  return Math.max(nh-perHour,0);
}
function sub(h){
  const hw=num(S.hw),day=hw/5;
  if(!hw)return '';
  return '≈ '+dec(h/day)+' Arbeitstage · '+dec(h/hw)+' Wochen';
}
function renderOut(){
  const nh=netHourly(),eh=effectiveHourly(nh),fm=fixedMonthly(),out=$('out');
  if(!nh){$('netinfo').textContent='';out.innerHTML='<p class="err">Trag Lohn und Wochenstunden ein.</p>';return}
  $('netinfo').textContent=fm
    ? 'Netto pro Stunde: '+eur(nh)+' · nach Fixkosten: '+eur(eh)+'/Std'
    : 'Netto pro Stunde: '+eur(nh);
  const items=S.items.filter(i=>num(i.price));
  if(!items.length){out.innerHTML='<p class="note">Trag einen Preis ein.</p>';return}
  if(!eh){out.innerHTML='<p class="err">Fixkosten übersteigen deinen Lohn.</p>';return}
  let html='',sum=0;
  items.forEach(i=>{
    const p=num(i.price),h=p/eh;sum+=p;
    html+='<div class="res"><div class="n">'+esc(i.name||'Gegenstand')+' · '+eur(p)+'</div><div class="big">'+dur(h)+'</div><div class="sub">'+sub(h)+'</div></div>';
  });
  if(items.length>1||num(S.saved)){
    const rest=Math.max(sum-num(S.saved),0),h=rest/eh;
    html+='<div class="total"><div class="n">Gesamt'+(num(S.saved)?' (abzüglich Gespartes)':'')+' · '+eur(rest)+'</div><div class="big">'+dur(h)+'</div><div class="sub">'+sub(h)+'</div></div>';
  }
  out.innerHTML=html;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderItems(){
  $('items').innerHTML=S.items.map((it,i)=>
    '<div class="item"><label>Name<input data-i="'+i+'" data-k="name" value="'+esc(it.name)+'" placeholder="z. B. Laptop"></label>'+
    '<label>Preis (CHF)<input data-i="'+i+'" data-k="price" type="number" inputmode="decimal" min="0" step="0.01" value="'+esc(it.price)+'"></label>'+
    '<button class="del" data-del="'+i+'" aria-label="Entfernen">×</button></div>').join('');
}
function renderFixed(){
  $('fixed').innerHTML=S.fixed.map((it,i)=>
    '<div class="item fx"><label>Name<input data-i="'+i+'" data-k="name" value="'+esc(it.name)+'" placeholder="z. B. Netflix"></label>'+
    '<label>Betrag (CHF)<input data-i="'+i+'" data-k="price" type="number" inputmode="decimal" min="0" step="0.01" value="'+esc(it.price)+'"></label>'+
    '<label>Zeitraum<select data-i="'+i+'" data-k="period"><option value="month"'+(it.period==='month'?' selected':'')+'>mtl.</option><option value="year"'+(it.period==='year'?' selected':'')+'>jährl.</option></select></label>'+
    '<button class="del" data-del="'+i+'" aria-label="Entfernen">×</button></div>').join('');
}
function renderMode(){
  $('m-hour').setAttribute('aria-pressed',S.mode==='hour');
  $('m-month').setAttribute('aria-pressed',S.mode==='month');
  $('thumb').classList.toggle('r',S.mode==='month');
  $('wl').textContent=S.mode==='hour'?'Stundenlohn (€)':'Monatsgehalt brutto (€)';
}
$('m-hour').onclick=()=>{S.mode='hour';renderMode();renderOut();save()};
$('m-month').onclick=()=>{S.mode='month';renderMode();renderOut();save()};
[['wage','wage'],['hw','hw'],['ded','ded'],['saved','saved']].forEach(([id,k])=>{
  $(id).value=S[k];
  $(id).addEventListener('input',e=>{S[k]=e.target.value;renderOut();save()});
});
$('items').addEventListener('input',e=>{
  const i=e.target.dataset.i;if(i===undefined)return;
  S.items[i][e.target.dataset.k]=e.target.value;renderOut();save();
});
$('items').addEventListener('click',e=>{
  const d=e.target.dataset.del;if(d===undefined)return;
  S.items.splice(+d,1);if(!S.items.length)S.items.push({name:'',price:''});
  renderItems();renderOut();save();
});
$('add').onclick=()=>{S.items.push({name:'',price:''});renderItems();save();
  const f=document.querySelectorAll('#items .item:last-child input')[0];if(f)f.focus()};
$('fixed').addEventListener('input',e=>{
  const i=e.target.dataset.i;if(i===undefined)return;
  S.fixed[i][e.target.dataset.k]=e.target.value;renderOut();save();
});
$('fixed').addEventListener('change',e=>{
  const i=e.target.dataset.i;if(i===undefined||e.target.tagName!=='SELECT')return;
  S.fixed[i][e.target.dataset.k]=e.target.value;renderOut();save();
});
$('fixed').addEventListener('click',e=>{
  const d=e.target.dataset.del;if(d===undefined)return;
  S.fixed.splice(+d,1);if(!S.fixed.length)S.fixed.push({name:'',price:''});
  renderFixed();renderOut();save();
});
$('addFixed').onclick=()=>{S.fixed.push({name:'',price:'',period:'month'});renderFixed();save();
  const f=document.querySelectorAll('#fixed .item:last-child input')[0];if(f)f.focus()};
renderMode();renderItems();renderFixed();renderOut();
</script>
</body>
</html>
